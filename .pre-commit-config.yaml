# Configuration Pre-commit pour ebook-translator
# Installation : uv run pre-commit install
# Exécution manuelle : uv run pre-commit run --all-files

repos:
  # Outils Python via uv (versions synchronisées avec pyproject.toml)
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff - Formatage du code
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ruff
        name: Ruff - Linting du code
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]

      - id: basedpyright
        name: BasedPyright - Vérification des types (strict)
        entry: uv run basedpyright src/
        language: system
        pass_filenames: false
        always_run: true

  # Hooks standards pour qualité générale
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: Suppression espaces en fin de ligne
      - id: end-of-file-fixer
        name: Ajout saut de ligne en fin de fichier
      - id: check-yaml
        name: Validation des fichiers YAML
      - id: check-toml
        name: Validation des fichiers TOML
      - id: check-json
        name: Validation des fichiers JSON
      - id: check-added-large-files
        name: Détection de fichiers volumineux
        args: ['--maxkb=500']
      - id: check-merge-conflict
        name: Détection de marqueurs de conflit
      - id: debug-statements
        name: Détection de debug statements (pdb, breakpoint)
      - id: mixed-line-ending
        name: Détection de fins de ligne mixtes
        args: ['--fix=lf']

  # Pytest - Tests rapides (optionnel, peut ralentir les commits)
  # Décommentez si vous voulez exécuter les tests à chaque commit
  # - repo: local
  #   hooks:
  #     - id: pytest-check
  #       name: Pytest - Tests unitaires
  #       entry: uv run pytest
  #       language: system
  #       pass_filenames: false
  #       always_run: true

# Stages d'exécution (pre-commit par défaut)
default_stages: [pre-commit]

# Échec rapide : s'arrête au premier échec
fail_fast: false
