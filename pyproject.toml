[project]
name = "ebook-translator"
version = "0.1.0"
description = "Traduisez des fichiers EPUB en utilisant des Large Language Models (DeepSeek, OpenAI, etc.)"
authors = [
    {name = "NeOzay", email = "neozay.ozay@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["epub", "translation", "llm", "deepseek", "openai", "ebook"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "ebooklib (>=0.19,<0.20)",
    "openai (>=2.1.0,<3.0.0)",
    "bs4 (>=0.0.2,<0.0.3)",
    "tiktoken (==0.12.0)",
    "jinja2 (==3.1.6)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "tqdm (>=4.66.0,<5.0.0)",
]

[project.scripts]
ebook-translator = "ebook_translator.__main__:main"

[project.urls]
Homepage = "https://github.com/NeOzay/ebook-translator"
Repository = "https://github.com/NeOzay/ebook-translator"
Issues = "https://github.com/NeOzay/ebook-translator/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src/ebook_translator",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
]

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", "build", "dist"]
venvPath = "."
venv = ".venv"
# Mode strict : détection maximale d'erreurs de typage
typeCheckingMode = "strict"
reportUnusedImport = true
reportUnusedVariable = true
reportUnusedFunction = false  # Peut avoir des fonctions utilitaires non utilisées
reportMissingTypeStubs = false  # Bibliothèques tierces sans stubs
reportPrivateUsage = true
reportConstantRedefinition = true
reportIncompatibleMethodOverride = true
reportMissingParameterType = true
reportMissingTypeArgument = true
reportUnnecessaryIsInstance = true
reportUnnecessaryCast = true
reportUnnecessaryComparison = true
reportUnnecessaryContains = true

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # Répertoires standards à exclure
  \.eggs
  | \.git
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["src", "tests"]
skip_glob = ["**/migrations/*", "**/__pycache__/*"]

[tool.ruff]
# Configuration Ruff pour linting moderne
line-length = 88
target-version = "py312"
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
# Sélection des règles de linting
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

ignore = [
    "E501",   # Line too long (géré par black)
    "PLR0913", # Too many arguments to function call
    "PLR2004", # Magic value used in comparison
]

[tool.ruff.lint.per-file-ignores]
# Règles spécifiques pour les tests
"tests/**/*.py" = [
    "ARG001",  # Unused function argument (fixtures)
    "S101",    # Use of assert detected
    "PLR2004", # Magic value in comparison
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
ignore_missing_imports = true


[tool.poetry]
packages = [{include = "ebook_translator", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pyright (>=1.1.406,<2.0.0)",
    "black (>=24.0.0,<25.0.0)",
    "isort (>=5.13.0,<6.0.0)",
    "ruff (>=0.8.0,<1.0.0)",
    "pre-commit (>=3.0.0)",
]
