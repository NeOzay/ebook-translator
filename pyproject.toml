[project]
name = "ebook-translator"
version = "0.1.0"
description = "Traduisez des fichiers EPUB en utilisant des Large Language Models (DeepSeek, OpenAI, etc.)"
authors = [{ name = "NeOzay", email = "neozay.ozay@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
keywords = ["deepseek", "ebook", "epub", "llm", "openai", "translation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Utilities",
]
dependencies = [
  "bs4>=0.0.2,<0.0.3",
  "ebooklib>=0.19,<0.20",
  "instructor>=1.15.1",
  "jinja2==3.1.6",
  "openai>=2.1.0,<3.0.0",
  "pydantic>=2.12.5",
  "python-dotenv>=1.0.0,<2.0.0",
  "tiktoken==0.12.0",
  "tqdm>=4.66.0,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/NeOzay/ebook-translator"
Issues = "https://github.com/NeOzay/ebook-translator/issues"
Repository = "https://github.com/NeOzay/ebook-translator"

[project.scripts]
ebook-translator = "ebook_translator.__main__:main"

[dependency-groups]
dev = [
  "basedpyright>=1.36.2,<2.0.0",
  "hatchling>=1.29.0",
  "pre-commit>=4.5.0,<5.0.0",
  "pytest>=9.0.2,<10.0.0",
  "pytest-cov>=7.0.0,<8.0.0",
  "ruff>=0.14.9,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.basedpyright]
include = ["src"]
exclude = ["**/__pycache__", "build", "dist"]
venvPath = "."
venv = ".venv"
# Mode strict : détection maximale d'erreurs de typage
typeCheckingMode = "strict"
reportUnusedImport = true
reportUnusedVariable = true
reportUnusedFunction = false  # Peut avoir des fonctions utilitaires non utilisées
reportMissingTypeStubs = false  # Bibliothèques tierces sans stubs
reportPrivateUsage = true
reportConstantRedefinition = true
reportIncompatibleMethodOverride = true
reportMissingParameterType = true
reportMissingTypeArgument = true
reportUnnecessaryIsInstance = true
reportUnnecessaryCast = true
reportUnnecessaryComparison = true
reportUnnecessaryContains = true

[tool.hatch.build.targets.wheel]
packages = ["src/ebook_translator", "src/template"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
python_classes = "Test*"
python_files = "test_*.py"
python_functions = "test_*"
testpaths = ["tests"]

# Markers pour organisation modulaire et filtrage
markers = [
  "unit: Unit tests (fast, isolated)",
  "integration: Integration tests (multi-component)",
  "e2e: End-to-end tests (full workflow)",
  "llm: Tests requiring LLM API calls (skip in CI)",
  "slow: Slow tests (> 1s)",
  # Markers par module (optionnel, pour filtrage ciblé)
  "analysis: Analysis module tests",
  "checks: Checks module tests",
  "htmlpage: HTML page module tests",
  "llm_module: LLM module tests",
  "pipeline: Pipeline module tests",
  "segmentation: Segmentation module tests",
  "validation: Validation module tests",
  "glossary: Glossary module tests",
  "translation: Translation module tests",
]

addopts = [
  "-v",
  "--strict-markers",
  "--tb=short",
  "--cov=src/ebook_translator",
  "--cov-report=term-missing",
  "--cov-report=html",
  "--cov-fail-under=80",
]

[tool.ruff]
# Configuration Ruff pour le formatage et le linting
line-length = 88
target-version = "py313"
src = ["src", "tests"]
exclude = [
  ".eggs",
  ".git",
  ".venv",
  "__pycache__",
  "build",
  "dist",
  "*.egg-info",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
# Sélection des règles de linting
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]

ignore = [
  "E501",  # Line too long (géré par ruff format)
  "PLR0913",  # Too many arguments to function call
  "PLR2004",  # Magic value used in comparison
  "F821",  # Checks for uses of undefined names.
]

[tool.ruff.lint.per-file-ignores]
# Règles spécifiques pour les tests
"tests/**/*.py" = [
  "ARG001",  # Unused function argument (fixtures)
  "S101",  # Use of assert detected
  "PLR2004",  # Magic value in comparison
]

[tool.ruff.lint.isort]
# `template` est un submodule (src/template) : sans ça, ruff le reclasse en
# third-party dès que le submodule n'est pas checkouté.
known-first-party = ["ebook_translator", "template"]

[tool.ruff.lint.pydocstyle]
convention = "google"
