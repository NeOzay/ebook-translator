# Seed du banc réel — `bench/config_glossaire_seed.py`, variante `preremp`.
#
# Remplace le glossaire du tome voisin que prévoyait le plan, perdu avec le
# corpus de la session 2. Ce n'est donc pas un glossaire appris : c'est un
# préremplissage contrôlé, dérivé de la terminologie réellement présente dans
# le Vol 01 et de ses fréquences. Le banc mesure de ce fait l'effet d'un
# glossaire garni sur la sélection des termes, non la situation de production
# (tome suivant traduit après le précédent).
#
# Les trois niveaux peuplent les trois groupes de
# `common/glossary_existing_block.jinja` :
#
#   valide   → w=5, confiance haute, listé comme à ne pas réémettre
#   arbitrer → propositions pondérées, le modèle doit trancher
#   emergent → w=1, forme seule, sans traduction soumise
#
# Les occurrences notées en commentaire sont comptées sur le texte du tome.
# Aucune entrée `user` : la question porte sur les trois groupes d'arbitrage,
# et une entrée user en sort par construction.

# ─────────────────────────── Validés (w=5) ───────────────────────────
# Noms propres dominants, dont la forme française ne fait pas débat. Le
# modèle ne devrait pas les réémettre — c'est la première chose à mesurer.

